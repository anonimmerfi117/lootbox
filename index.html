        <div class="field"><label>Раздел</label><select id="f-section" onchange="livePreview()">${Object.entries(S.data.sections).map(([k, s]) => opt(k, s.title, p.section)).join('')}</select></div>
      </div>
      <div class="field"><label>Бейдж</label><select id="f-badge" onchange="livePreview()">${opt('', 'Без бейджа', p.badge)}${BADGES.map((b) => opt(b, b, p.badge)).join('')}${p.badge && !BADGES.includes(p.badge) ? opt(p.badge, p.badge, p.badge) : ''}</select>
        <div class="hint">Товары с бейджем попадают в «Сейчас берут». Хит подсвечивается золотом, Редкое — фиолетовым, остальные — синим.</div></div>
      <div class="field"><label>Описание</label><textarea id="f-desc" rows="5">${esc(p.description || '')}</textarea></div>
    </div>
    <div class="form-sec"><h3>Цена и выдача</h3>
      <div class="field"><label>Как выдаётся</label><select id="f-kind" onchange="keepForm(this.value)">${Object.entries(KIND_TEXT).map(([k, v]) => opt(k, v[0], c.kind)).join('')}</select>
        ${S.data.demoAuto ? '<div class="hint">В демо-режиме любой товар выдаётся мгновенно с тестовыми данными.</div>' : ''}</div>
      <div class="grid2">
        ${phys ? '' : `<div class="field"><label>Цена в звёздах <i>*</i></label><input id="f-price" type="number" min="1" inputmode="numeric" value="${esc(p.price ?? '')}" oninput="livePreview()"></div>`}
        <div class="field"><label>${phys ? 'Цена, $ <i>*</i>' : 'Цена в крипте, $'}</label><input id="f-usd" type="number" min="0" step="0.01" inputmode="decimal" placeholder="${phys ? '' : 'Только звёзды'}" value="${esc(p.price_usd ?? '')}" oninput="livePreview()"></div>
      </div>
      ${c.kind === 'digital_auto' ? '' : `<div class="field"><label>Сколько в наличии</label><input id="f-stock" type="number" min="0" inputmode="numeric" placeholder="Без ограничений" value="${p.stock ?? ''}"></div>`}
      <div class="field"><label>Что спросить у покупателя</label><input id="f-ask" value="${esc(p.ask || '')}" placeholder="Например: UID и сервер"><div class="hint">Оставьте пустым, если ничего не нужно.</div></div>
    </div>
    <label class="form-sec row" style="cursor:pointer"><div class="grow"><b class="sm">Показывать в маркете</b><div class="xs mut">Скрытый товар видите только вы</div></div>
      <input type="checkbox" id="f-active" ${p.active ? 'checked' : ''} style="display:none" onchange="this.nextElementSibling.classList.toggle('on',this.checked)"><span class="switch ${p.active ? 'on' : ''}"></span></label>
    ${stock}
    ${c.id ? `<button class="btn sm line" style="margin:14px auto 0" onclick="shareProduct(${c.id})">${ic('link', 's')} Ссылка на товар для поста</button>` : ''}
    <div class="bar"><button class="btn gold" onclick="saveProduct(${c.id || 0})">${ic('check')} ${c.id ? 'Сохранить' : 'Создать товар'}</button></div>`;
};
function previewOf(c, d) {
  return { ...c.base, ...d, id: 0, kind: c.kind, title: d.title || 'Название товара', price_stars: +d.price || 0, price_usd: +d.price_usd || null, available: null, reviews: 0, game_id: d.game_id ? +d.game_id : null, badge: d.badge || null };
}
function readDraft() {
  const v = (k) => { const el = $('#f-' + k); return el ? el.value : ''; };
  const c = cur();
  return {
    title: v('title'), game_id: v('game'), section: v('section'), badge: v('badge'), description: v('desc'),
    price: $('#f-price') ? v('price') : ((c.draft ? c.draft.price : (c.base || {}).price_stars) ?? ''), price_usd: v('usd'),
    stock: $('#f-stock') ? v('stock') : ((c.draft || c.base || {}).stock ?? ''),
    ask: v('ask'), active: $('#f-active').checked,
  };
}
function livePreview() { const c = cur(); $('.preview').innerHTML = itemRow(previewOf(c, readDraft())); }
function keepForm(kind) { const c = cur(); c.draft = readDraft(); c.kind = kind; render(false); }
function readForm(id) {
  const d = readDraft(), kind = cur().kind;
  return {
    id, kind, emoji: (cur().base || {}).emoji || '', title: d.title, game_id: d.game_id, section: d.section,
    price_stars: kind === 'physical' ? '' : d.price, price_usd: d.price_usd,
    stock: kind === 'digital_auto' ? '' : d.stock, ask: d.ask, badge: d.badge, description: d.description, active: d.active,
  };
}
async function saveProduct(id) {
  try {
    const r = await api('admin_product_save', { product: readForm(id) });
    hapticN(); toast(id ? 'Изменения сохранены' : 'Товар создан', 'ok');
    await reloadCatalog();
    S.stack[S.stack.length - 1] = { v: 'aproduct', id: r.id };
    render(!id);
  } catch (e) { hapticN('error'); toast(e.message, 'err'); }
}
async function stockAdd(pid) {
  const text = $('#stock-add').value;
  try { const r = await api('admin_stock_add', { product_id: pid, text }); hapticN(); toast(`На склад добавлено: ${r.added}`, 'ok'); cur().draft = readDraft(); reloadCatalog(); refresh(); }
  catch (e) { toast(e.message, 'err'); }
}
async function stockDel(id) {
  if (!(await ask('Удалить ключ со склада?'))) return;
  try { cur().draft = readDraft(); await api('admin_stock_delete', { id }); reloadCatalog(); refresh(); } catch (e) { toast(e.message, 'err'); }
}

A.promos = async () => {
  const { promos } = await api('admin_promos');
  return `<div class="panel">
      <b class="disp">Новый промокод</b>
      <div class="grid2">
        <div class="field"><label>Код</label><input id="pr-code" placeholder="SALE15" oninput="this.value=this.value.toUpperCase()"></div>
        <div class="field"><label>Скидка, %</label><input id="pr-pct" type="number" min="1" max="90" inputmode="numeric" placeholder="15"></div>
      </div>
      <div class="field"><label>Сколько раз можно применить</label><input id="pr-uses" type="number" min="0" inputmode="numeric" placeholder="Без ограничений"></div>
      <button class="btn gold" style="margin-top:14px" onclick="savePromo()">${ic('plus', 's')} Создать промокод</button></div>
    <div class="sec"><h2>Действуют сейчас</h2><span>${promos.length}</span></div>
    ${promos.length ? `<div class="panel" style="padding:2px 14px">${promos.map((p) => `<div class="li"><div class="tile r-legend">${ic('tag')}</div><div class="grow"><b>${esc(p.code)}</b> <span class="mut">−${p.percent}%</span><div class="xs mut">${p.uses_left === null ? 'без ограничений' : `осталось ${p.uses_left} ${plural(p.uses_left, 'применение', 'применения', 'применений')}`}</div></div><button class="copy" onclick="copy('${esc(p.code)}')" aria-label="Скопировать">${ic('copy', 's')}</button><button class="copy" onclick="delPromo('${esc(p.code)}')" aria-label="Удалить">${ic('trash', 's')}</button></div>`).join('')}</div>` : empty('tag', 'Промокодов нет', 'Создайте первый, чтобы запустить акцию.')}`;
};
async function savePromo() {
  try { await api('admin_promo_save', { code: $('#pr-code').value, percent: $('#pr-pct').value, uses_left: $('#pr-uses').value }); hapticN(); toast('Промокод создан', 'ok'); render(false); }
  catch (e) { toast(e.message, 'err'); }
}
async function delPromo(code) {
  if (!(await ask(`Удалить промокод ${code}?`))) return;
  try { await api('admin_promo_delete', { code }); toast('Промокод удалён', 'ok'); render(false); } catch (e) { toast(e.message, 'err'); }
}

A.mail = () => `<div class="panel">
    <b class="disp">Сообщение всем покупателям</b>
    <div class="xs mut" style="margin:4px 0 12px">Придёт в чат с ботом вместе с кнопкой «Открыть маркет». Подходит для новинок, скидок и акций.</div>
    <textarea id="mail-text" rows="6" placeholder="Скидка 20% на все ключи до воскресенья по промокоду LOOT20" oninput="$('#mail-prev').textContent=this.value||'Здесь появится текст сообщения'"></textarea>
    <div class="xs mut" style="margin:14px 0 6px;font-weight:700">Так увидит покупатель</div>
    <div class="msg them pre" id="mail-prev" style="max-width:100%">Здесь появится текст сообщения</div>
    <button class="btn gold" style="margin-top:14px" onclick="sendMail()">${ic('send', 's')} Отправить всем</button></div>`;
async function sendMail() {
  const text = $('#mail-text').value.trim();
  if (!text) return toast('Напишите текст сообщения', 'err');
  if (!(await ask('Отправить сообщение всем пользователям бота?'))) return;
  try { const r = await api('admin_broadcast', { text }); hapticN(); toast(`Отправляем ${r.queued} ${plural(r.queued, 'пользователю', 'пользователям', 'пользователям')}`, 'ok'); $('#mail-text').value = ''; }
  catch (e) { toast(e.message, 'err'); }
}

/* ═══════════════ Запуск ═══════════════ */
async function start() {
  if (!tg || !tg.initData) {
    $('#app').innerHTML = empty('game', 'LOOTBOX', 'Откройте магазин через Telegram-бота.');
    $('.tabbar').style.display = 'none';
    return;
  }
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('#10131c'); tg.setBackgroundColor('#10131c'); tg.setBottomBarColor && tg.setBottomBarColor('#10131c'); } catch (e) {}
  try { tg.disableVerticalSwipes(); } catch (e) {}
  tg.BackButton.onClick(back);
  try {
    const [d, cart, del] = await Promise.all([api('bootstrap'), store.get('cart'), store.get('delivery')]);
    S.data = d;
    try { S.cart = JSON.parse(cart || '[]').filter((i) => i && i.id); } catch (e) { S.cart = []; }
    try { S.delivery = JSON.parse(del || '{}') || {}; } catch (e) { S.delivery = {}; }
  } catch (e) {
    $('#app').innerHTML = errorBox(e.message);
    return;
  }
  if (S.data.admin) api('admin_orders', { filter: 'active' }).then((r) => { S.counts.attention = r.orders.length; renderTabbar(); }).catch(() => {});
  const h = (location.hash || '').slice(1);
  const sp = (tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  let m;
  if ((m = /^p[=_](\d+)$/.exec(h) || /^p_(\d+)$/.exec(sp)) && P(m[1])) S.stack = [{ v: 'home' }, { v: 'product', id: +m[1] }];
  else if ((m = /^o[=_](\d+)$/.exec(h) || /^o_(\d+)$/.exec(sp))) S.stack = [{ v: 'orders' }, { v: 'order', id: +m[1] }];
  else if ((m = /^ao=(\d+)$/.exec(h)) && S.data.admin) S.stack = [{ v: 'admin' }, { v: 'aorder', id: +m[1] }];
  else if (h === 'orders') S.stack = [{ v: 'orders' }];
  else if (h === 'admin' && S.data.admin) S.stack = [{ v: 'admin' }];
  render(true);
}
start();
</script>
