<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>LOOTBOX — игровой маркет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c11; --s1:#12151d; --s2:#1a1e29; --s3:#232836; --line:#262c3b;
  --tx:#eef1f7; --mut:#8a93a8; --dim:#5d6578;
  --acc:#8b5cf6; --acc2:#22d3ee; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#22d3ee 100%);
  --r:16px; --r2:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:84px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
#app{max-width:640px;margin:0 auto;padding:12px 16px 24px}
.h1{font:800 22px/1.15 Unbounded,Inter,sans-serif;letter-spacing:-.01em;margin:4px 0 14px}
.h2{font:700 16px/1.2 Unbounded,Inter,sans-serif;margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between}
.h2 small{font:500 13px Inter;color:var(--mut)}
.mut{color:var(--mut)} .dim{color:var(--dim)} .sm{font-size:13px} .xs{font-size:12px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack>*+*{margin-top:10px}
.pre{white-space:pre-wrap;word-break:break-word}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.logo{font:800 22px Unbounded,sans-serif;letter-spacing:.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo-sub{font-size:12px;color:var(--mut);margin-top:-2px}
.ava{width:38px;height:38px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-weight:700;overflow:hidden;border:2px solid var(--line)}
.ava img{width:100%;height:100%;object-fit:cover}

.demo{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:var(--r2);background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.28);font-size:13px;color:#cfc4ff;margin-bottom:14px}

.search{position:relative;margin-bottom:6px}
.search input{padding-left:40px;background:var(--s1)}
.search:before{content:"";position:absolute;left:15px;top:50%;width:12px;height:12px;border:2px solid var(--mut);border-radius:50%;transform:translateY(-60%)}
.search:after{content:"";position:absolute;left:27px;top:56%;width:6px;height:2px;background:var(--mut);transform:rotate(45deg)}

/* games */
.games{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.game{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;padding:8px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;isolation:isolate}
.game:after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 100% 0%,rgba(255,255,255,.22),transparent 60%);z-index:-1}
.game .ge{font-size:22px;line-height:1}
.game .gt{font:700 10px/1.1 Unbounded,sans-serif;letter-spacing:.02em;text-shadow:0 1px 6px rgba(0,0,0,.35);word-break:break-word}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}

/* products */
.pcard{display:flex;align-items:center;gap:12px;width:100%;padding:11px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);text-align:left;transition:transform .12s, background .12s}
.pcard:active{transform:scale(.985);background:var(--s2)}
.pcard+.pcard{margin-top:8px}
.pe{flex:none;width:52px;height:52px;border-radius:13px;display:grid;place-items:center;font-size:26px}
.pt{font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pm{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:4px;font-size:12px;color:var(--mut)}
.pp{flex:none;font:700 15px Unbounded,sans-serif;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.01em}
.t-auto{background:rgba(34,211,238,.12);color:var(--acc2)}
.t-man{background:rgba(139,92,246,.14);color:#b9a2ff}
.t-srv{background:rgba(245,158,11,.13);color:#fbbf24}
.t-phy{background:rgba(236,72,153,.13);color:#f472b6}
.t-badge{background:var(--grad);color:#fff}
.t-out{background:rgba(239,68,68,.13);color:#f87171}

/* product page */
.hero{border-radius:22px;padding:22px 18px;position:relative;overflow:hidden;isolation:isolate;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.45));z-index:-1}
.hero .he{position:absolute;right:14px;top:8px;font-size:84px;line-height:1;filter:drop-shadow(0 8px 20px rgba(0,0,0,.35))}
.hero .hg{font:700 11px Unbounded,sans-serif;letter-spacing:.06em;opacity:.85;text-transform:uppercase}
.hero .ht{font:800 21px/1.2 Unbounded,sans-serif;margin-top:4px;max-width:85%}
.price-big{font:800 28px Unbounded,sans-serif}
.info{display:flex;gap:10px;padding:12px 13px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r2);font-size:13px}
.stepper{display:inline-flex;align-items:center;background:var(--s2);border:1px solid var(--line);border-radius:12px}
.stepper button{width:38px;height:38px;font-size:20px;color:var(--mut)}
.stepper span{min-width:28px;text-align:center;font-weight:700}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;border-radius:14px;font-weight:700;font-size:15px;background:var(--s3);transition:transform .12s, opacity .12s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--grad);color:#fff;box-shadow:0 8px 24px -10px rgba(139,92,246,.7)}
.btn.ok{background:var(--ok);color:#06210f}
.btn.bad{background:rgba(239,68,68,.14);color:#f87171}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:10px 12px;font-size:13px;border-radius:11px;width:auto}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:8px}.btns>*{flex:1}
.sticky{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));margin-top:16px;padding-top:10px;background:linear-gradient(180deg,transparent,var(--bg) 30%)}

/* reviews */
.stars{color:#fbbf24;letter-spacing:1px}
.rev+.rev{margin-top:8px}

/* cart */
.citem{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.citem:first-child{border-top:0;padding-top:2px}
.citem .pe{width:44px;height:44px;font-size:22px;border-radius:11px}
.x{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--dim);font-size:18px}
.sum{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.sum.total{font-weight:700;font-size:17px;padding-top:10px;margin-top:6px;border-top:1px dashed var(--line)}

/* methods */
.method{display:flex;align-items:center;gap:12px;width:100%;padding:13px;border-radius:14px;background:var(--s1);border:1.5px solid var(--line);text-align:left}
.method+.method{margin-top:8px}
.method.on{border-color:var(--acc);background:rgba(139,92,246,.08)}
.method .mi{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:20px;background:var(--s2)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.method.on .radio{border:6px solid var(--acc)}
.label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 6px}

/* orders */
.ocard{display:block;width:100%;text-align:left;padding:13px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r)}
.ocard+.ocard{margin-top:8px}
.st{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.st:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-pending{background:rgba(245,158,11,.13);color:#fbbf24}
.s-paying,.s-processing{background:rgba(139,92,246,.15);color:#b9a2ff}
.s-delivered{background:rgba(34,211,238,.13);color:var(--acc2)}
.s-completed{background:rgba(34,197,94,.13);color:#4ade80}
.s-dispute{background:rgba(239,68,68,.14);color:#f87171}
.s-refunded,.s-cancelled{background:var(--s3);color:var(--mut)}
.steps{display:flex;gap:6px;margin:14px 0 4px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--s3)}
.steps i.on{background:var(--grad)}
.steps-l{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.code{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);border:1px dashed #3a4256;border-radius:11px;font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
.code+.code{margin-top:6px}
.copy{flex:none;padding:6px 10px;border-radius:8px;background:var(--s3);font:600 12px Inter;color:var(--tx)}

/* chat */
.chat{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto;padding:2px}
.msg{max-width:82%;padding:9px 12px;border-radius:15px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.msg .mt{font-size:10px;opacity:.6;margin-top:3px;text-align:right}
.msg.me{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;background:var(--s3);border-bottom-left-radius:5px}
.msg.sys{align-self:center;background:transparent;color:var(--mut);font-size:12px}
.chatin{display:flex;gap:8px;margin-top:10px}
.chatin input{flex:1}
.chatin button{flex:none;width:46px;border-radius:12px;background:var(--grad);color:#fff;font-size:18px}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:rgba(10,12,17,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.tabbar .in{display:flex;width:100%;max-width:640px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--dim);position:relative}
.tab .ti{font-size:21px;line-height:1;filter:grayscale(1) opacity(.7);transition:filter .15s}
.tab.on{color:var(--tx)} .tab.on .ti{filter:none}
.badge{position:absolute;top:1px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}

/* admin */
.seg{display:flex;gap:4px;padding:4px;background:var(--s1);border:1px solid var(--line);border-radius:14px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;white-space:nowrap;padding:9px 10px;border-radius:10px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--s3);color:var(--tx)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{padding:13px;background:var(--s1);border:1px solid var(--line);border-radius:14px}
.kpi b{display:block;font:800 20px Unbounded,sans-serif;margin-top:4px}
.kpi.hl{background:linear-gradient(135deg,rgba(139,92,246,.2),rgba(34,211,238,.12));border-color:rgba(139,92,246,.35)}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars i{width:100%;border-radius:6px 6px 3px 3px;background:var(--grad);min-height:3px}
.bars span{font-size:10px;color:var(--dim)}
.line-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.line-item:first-child{border-top:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:10px;padding:12px;background:var(--s2);border:1px solid var(--line);border-radius:12px;margin-top:12px}
.check input{width:20px;height:20px;accent-color:var(--acc)}

/* misc */
.empty{text-align:center;padding:48px 20px;color:var(--mut)}
.empty .ei{font-size:54px;margin-bottom:10px}
.loader{display:grid;place-items:center;padding:80px 0}
.loader i{width:32px;height:32px;border-radius:50%;border:3px solid var(--s3);border-top-color:var(--acc);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;z-index:50;max-width:calc(100% - 32px);padding:11px 16px;border-radius:13px;background:var(--s3);border:1px solid var(--line);font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:all .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{border-color:rgba(34,197,94,.5)} .toast.err{border-color:rgba(239,68,68,.5)}
.guar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.guar div{padding:12px 10px;background:var(--s1);border:1px solid var(--line);border-radius:14px;font-size:12px;color:var(--mut)}
.guar b{display:block;color:var(--tx);font-size:13px;margin:4px 0 2px}
.fade{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rate{display:flex;gap:6px;font-size:30px}
.rate button{filter:grayscale(1) opacity(.35);transition:filter .1s,transform .1s}
.rate button.on{filter:none}
.rate button:active{transform:scale(1.2)}
</style>
</head>
<body>
<div id="app"><div class="loader"><i></i></div></div>
<nav class="tabbar"><div class="in" id="tabbar"></div></nav>

<script>
/* ═══════════════ Настройка ═══════════════
   Вставьте сюда адрес своего воркера Cloudflare (без / в конце) */
const API_URL = 'https://raspy-disk-e6be.anonimmerfi.workers.dev';

/* ═══════════════ Основа ═══════════════ */
const tg = window.Telegram && window.Telegram.WebApp;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (n) => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const money = (n, cur) => (cur === 'XTR' ? `${n} ⭐` : `${num(n)} ₽`);
const priceOf = (p) => (p.kind === 'physical' ? money(p.price_rub, 'RUB') : money(p.price_stars, 'XTR'));
const dateStr = (t) => new Date(t * 1000).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const haptic = (t = 'light') => { try { tg.HapticFeedback.impactOccurred(t); } catch (e) {} };
const hapticN = (t = 'success') => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };

const STATUS = {
  pending: 'Ожидает оплаты', paying: 'Обработка оплаты', processing: 'В работе', delivered: 'Выдан',
  completed: 'Завершён', dispute: 'Спор', refunded: 'Возврат', cancelled: 'Отменён',
};
const KIND = {
  digital_auto: { tag: '<span class="tag t-auto">⚡ Автовыдача</span>', hint: '⚡ Ключ придёт в чат с ботом сразу после оплаты — даже ночью.', name: 'Автовыдача (ключи со склада)' },
  digital_manual: { tag: '<span class="tag t-man">👤 От продавца</span>', hint: '👤 Продавец передаст товар вручную, обычно за 5–30 минут. Следить можно в заказе.', name: 'Выдаёт продавец вручную' },
  service: { tag: '<span class="tag t-srv">🚀 Услуга</span>', hint: '🚀 Услуга: продавец берёт заказ в работу и отчитывается в чате заказа.', name: 'Услуга (буст, пополнение)' },
  physical: { tag: '<span class="tag t-phy">📦 Доставка</span>', hint: '📦 Отправим курьером или почтой, трек-номер появится в заказе.', name: 'Физический товар (доставка)' },
};
const physPay = () => { const p = (S.data && S.data.payments) || {}; return [p.rub && 'карта ₽', p.crypto && 'крипта'].filter(Boolean); };
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const SECTION_COLORS = { topup: ['#22d3ee', '#2563eb'], gear: ['#c084fc', '#db2777'] };

const S = { data: null, cart: [], stack: [{ v: 'home' }], q: '', adminTab: 'stats', ordersFilter: 'active', delivery: {}, promo: null };
let renderToken = 0;

async function api(name, body) {
  const r = await fetch(`${API_URL}/api/${name}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Init-Data': tg ? tg.initData : '' },
    body: JSON.stringify(body || {}),
  }).catch(() => null);
  if (!r) throw new Error('Нет связи с сервером');
  const d = await r.json().catch(() => ({ error: 'Сервер ответил с ошибкой' }));
  if (!r.ok || d.error) throw new Error(d.error || 'Ошибка');
  return d;
}

function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2600);
}
const ask = (text) => new Promise((res) => {
  try { tg.showConfirm(text, (ok) => res(!!ok)); } catch (e) { res(confirm(text)); }
});
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  haptic(); toast('Скопировано', 'ok');
}

/* Хранение корзины и адреса в облаке Telegram (с запасным вариантом) */
const store = {
  get(k) {
    return new Promise((res) => {
      try { tg.CloudStorage.getItem(k, (e, v) => res(e ? null : v)); }
      catch (e) { try { res(localStorage.getItem(k)); } catch (_) { res(null); } }
    });
  },
  set(k, v) {
    try { tg.CloudStorage.setItem(k, v); } catch (e) { try { localStorage.setItem(k, v); } catch (_) {} }
  },
};
const saveCart = () => { store.set('cart', JSON.stringify(S.cart)); renderTabbar(); };

/* ═══════════════ Навигация ═══════════════ */
function go(v, p) { S.stack.push({ v, ...(p || {}) }); render(true); }
function tab(v) { haptic(); S.stack = [{ v }]; render(true); }
function back() { if (S.stack.length > 1) { S.stack.pop(); render(true); } }
const cur = () => S.stack[S.stack.length - 1];

async function render(scroll) {
  if (!tg || !S.data) return;
  const c = cur();
  try { S.stack.length > 1 ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
  renderTabbar();
  const token = ++renderToken;
  const out = V[c.v](c);
  let html;
  if (out && typeof out.then === 'function') {
    if (scroll) $('#app').innerHTML = '<div class="loader"><i></i></div>';
    try { html = await out; } catch (e) { html = errorBox(e.message); }
    if (token !== renderToken) return;
  } else html = out;

const G = (id) => S.data.games.find((g) => g.id === +id);
function colors(p) {
  const g = p.game_id && G(p.game_id);

const inStock = (p) => p.available === null || p.available > 0;
const maxQty = (p) => (p.section === 'accounts' ? 1 : Math.max(1, Math.min(10, p.available === null ? 10 : p.available)));

function pcard(p) {
  const tags = [KIND[p.kind].tag];

  else if (p.available !== null && p.available <= 3) tags.push(`<span>Осталось ${p.available}</span>`);
  if (p.reviews) tags.push(`<span class="stars">★</span><span>${p.rating} (${p.reviews})</span>`);
  return `<button class="pcard" onclick="go('product',{id:${p.id}})" ${inStock(p) ? '' : 'style="opacity:.6"'}>
    <div class="pe" style="${tint(p)}">${esc(p.emoji || '🎮')}</div>
    <div class="grow"><div class="pt">${esc(p.title)}</div><div class="pm">${tags.join('')}</div></div>

}

function qtyC(idx, d) { const i = S.cart[idx], p = P(i.id); i.qty = Math.max(1, Math.min(maxQty(p), i.qty + d)); haptic(); saveCart(); refresh(); }

V.checkout = (c) => {
  const kind = c.kind, lines = cartLines(kind);

  const d = S.delivery;
  const method = (k, icon, title, sub, on) => `<button class="method ${c.method === k ? 'on' : ''}" ${on ? `onclick="cur().method='${k}';haptic();refresh()"` : 'disabled style="opacity:.45"'}>

  return `<div class="h1">Оформление</div>
    <div class="card">

      ${disc ? `<div class="sum" style="color:#4ade80"><span>Промокод ${esc(S.promo.code)} −${S.promo.percent}%</span><span>−${money(disc, curr)}</span></div>` : ''}
      <div class="sum total"><span>К оплате</span><span>${money(total, curr)}</span></div>
    </div>
    <label class="label">Промокод</label>
    <div class="row">${S.promo
      ? `<div class="grow code" style="border-style:solid">🏷 ${esc(S.promo.code)} · −${S.promo.percent}%</div><button class="btn sm ghost" onclick="S.promo=null;refresh()">Убрать</button>`
      : `<input id="promo" placeholder="Например, DEMO10" oninput="this.value=this.value.toUpperCase()"><button class="btn sm" onclick="applyPromo()">Применить</button>`}</div>
    ${kind === 'physical' ? `
      <div class="h2">Доставка</div>
      <label class="label">Имя и фамилия *</label><input id="d-name" value="${esc(d.name || '')}" autocomplete="name">
      <label class="label">Телефон *</label><input id="d-phone" value="${esc(d.phone || '')}" type="tel" autocomplete="tel" placeholder="+7…">
      <label class="label">Адрес или пункт выдачи *</label><textarea id="d-address" rows="2" style="min-height:60px">${esc(d.address || '')}</textarea>
      <label class="label">Комментарий</label><input id="d-comment" value="${esc(d.comment || '')}" placeholder="Необязательно">
      <div class="h2">Оплата</div>
      ${pay.rub ? method('rub', '💳', 'Банковская карта', 'ЮKassa · тестовый режим', true) : ''}
      ${pay.crypto ? method('crypto', '₿', 'Криптовалюта', `USDT, TON, BTC через CryptoBot${pay.cryptoTestnet ? ' · тестовая сеть' : ''}`, true) : ''}
      ${!pay.rub && !pay.crypto ? '<div class="card mut sm">Оплата девайсов пока не подключена.</div>' : ''}
    ` : `
      <div class="h2">Оплата</div>
      <div class="method on"><div class="mi">⭐</div><div class="grow"><b>Telegram Stars</b><div class="xs mut">Звёзды покупаются прямо в Telegram</div></div><div class="radio"></div></div>
      <div class="xs dim" style="margin-top:8px">По правилам Telegram цифровые товары в ботах оплачиваются только звёздами.</div>`}
    <div class="sticky"><button class="btn pri" id="paybtn" onclick="payNow('${kind}')" ${kind === 'physical' && !c.method ? 'disabled' : ''}>Оплатить ${money(total, curr)}</button></div>`;
};
function readDelivery() {
  ['name', 'phone', 'address', 'comment'].forEach((k) => { const el = $('#d-' + k); if (el) S.delivery[k] = el.value.trim(); });
  store.set('delivery', JSON.stringify(S.delivery));
}
async function applyPromo() {
  const code = ($('#promo').value || '').trim();
  if (!code) return;
  if (cur().kind === 'physical') readDelivery();
  try { S.promo = await api('promo_check', { code }); hapticN(); toast(`Скидка ${S.promo.percent}% применена`, 'ok'); refresh(); }
  catch (e) { hapticN('error'); toast(e.message, 'err'); }
}
async function payNow(kind) {
  const c = cur(), btn = $('#paybtn');
  const lines = cartLines(kind);
  const body = { kind, items: lines.map((i) => ({ id: i.id, qty: i.qty, note: i.note })), promo: S.promo ? S.promo.code : null };
  if (kind === 'physical') { readDelivery(); body.delivery = S.delivery; body.method = c.method; }
  btn.disabled = true; btn.textContent = 'Создаём счёт…';
  try {
    const r = await api('checkout', body);
    const ids = new Set(lines.map((i) => i.idx));
    S.cart = S.cart.filter((_, i) => !ids.has(i)); S.promo = null; saveCart();
    S.stack = [{ v: 'orders' }, { v: 'order', id: r.order_id }];
    render(true);
    openPayment(r, r.order_id);
  } catch (e) {
    hapticN('error'); toast(e.message, 'err');
    btn.disabled = false; btn.textContent = 'Попробовать ещё раз';
  }
}
function openPayment(r, orderId) {
  if (r.invoice_url) {
    tg.openInvoice(r.invoice_url, (status) => {
      if (status === 'paid') { hapticN(); toast('Оплачено! Выдаём заказ…', 'ok'); pollOrder(orderId); }
      else if (status === 'failed') toast('Оплата не прошла', 'err');
      else refresh();
    });
  } else if (r.crypto_url) {
    tg.openTelegramLink(r.crypto_url);
    toast('После оплаты вернитесь и нажмите «Проверить оплату»');
  }
}
async function pollOrder(id, n = 0) {
  if (n > 8) return;
  await new Promise((r) => setTimeout(r, 1500));
  const c = cur();
  if (c.v === 'order' && c.id === id) {
    await refreshOrderData(c);
    if (c.data && ['pending', 'paying'].includes(c.data.order.status)) pollOrder(id, n + 1);
  }
}

async function refreshOrderData(c, call, body) {
  try {
    c.data = await api(call || 'order', { id: c.id, ...(body || {}) });
  } catch (e) { toast(e.message, 'err'); }
  if (cur() === c) refresh();
}

const STATUS_HINT = {
  pending: 'Ожидаем оплату. Неоплаченный заказ отменится через 24 часа.',
  paying: 'Обрабатываем оплату, это займёт пару секунд…',
  processing_digital: 'Продавец выполняет заказ. Обычно это занимает 5–30 минут — мы пришлём уведомление.',
  processing_physical: 'Собираем заказ. Трек-номер появится здесь после отправки.',
  delivered: 'Товар выдан. Проверьте его и подтвердите получение — после этого сделка закроется. Если не подтвердить, заказ закроется сам через 72 часа.',
  completed: 'Сделка завершена. Спасибо за покупку!',
  dispute: 'Открыт спор. Продавец ответит в чате ниже.',
  refunded: 'Деньги возвращены.',
  cancelled: 'Заказ отменён.',
};
function progress(o) {
  const labels = o.kind === 'physical' ? ['Оплата', 'Сборка', 'Отправка', 'Получено'] : ['Оплата', 'Выполнение', 'Выдача', 'Готово'];
  const lvl = { pending: 0, paying: 1, processing: 2, dispute: 3, delivered: 3, completed: 4 }[o.status];
  if (lvl === undefined) return '';
  return `<div class="steps">${labels.map((_, i) => `<i class="${i < lvl ? 'on' : ''}"></i>`).join('')}</div>
    <div class="steps-l">${labels.map((l) => `<span>${l}</span>`).join('')}</div>`;
}
function resultBlocks(o) {
  if (!o.result || !o.result.length) return '';
  return `<div class="h2">${o.kind === 'physical' ? 'Отправка' : 'Ваш товар'}</div><div class="card stack">
    ${o.result.map((b) => `<div><div class="sm mut" style="margin-bottom:6px">${esc(b.title)}</div>
      ${b.lines.map((l) => `<div class="code"><span class="grow">${esc(l)}</span><button class="copy" onclick='copy(${esc(JSON.stringify(l))})'>Копировать</button></div>`).join('')}</div>`).join('')}
    ${o.result.some((b) => b.lines.some((l) => l.startsWith('DEMO-'))) ? '<div class="xs dim">Это демонстрационные ключи — они не активируются.</div>' : ''}</div>`;
}
function itemsCard(o) {
  return `<div class="card">${o.items.map((i) => `<div class="sum"><span class="grow" style="padding-right:10px">${esc(i.emoji || '')} ${esc(i.title)}${i.qty > 1 ? ` ×${i.qty}` : ''}${i.note ? `<div class="xs mut">${esc(i.ask || 'Данные')}: ${esc(i.note)}</div>` : ''}</span><span>${money(i.price * i.qty, o.currency)}</span></div>`).join('')}
    ${o.discount ? `<div class="sum" style="color:#4ade80"><span>Промокод ${esc(o.promo)}</span><span>−${money(o.discount, o.currency)}</span></div>` : ''}
    <div class="sum total"><span>Итого</span><span>${money(o.total, o.currency)}</span></div>
    <div class="xs dim" style="margin-top:6px">${{ stars: '⭐ Telegram Stars', rub: '💳 Карта (ЮKassa)', crypto: '₿ Крипта (CryptoBot)' }[o.method] || ''} · ${dateStr(o.created_at)}</div></div>`;
}
function chatBlock(c, role) {
  const o = c.data.order;
  if (['pending', 'paying', 'cancelled'].includes(o.status)) return '';
  const msgs = c.data.messages;
  return `<div class="h2">Чат ${role === 'buyer' ? 'с продавцом' : 'с покупателем'}</div><div class="card">
    <div class="chat">${msgs.length ? msgs.map((m) => `<div class="msg ${m.sender === role ? 'me' : 'them'}">${esc(m.text)}<div class="mt">${dateStr(m.created_at)}</div></div>`).join('')
      : `<div class="msg sys">${role === 'buyer' ? 'Напишите продавцу, если есть вопросы по заказу' : 'Сообщений пока нет'}</div>`}</div>
    <div class="chatin"><input id="chat-in" placeholder="Сообщение…" onkeydown="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()">➤</button></div></div>`;
}
async function sendMsg() {
  const el = $('#chat-in'), text = el.value.trim();
  if (!text) return;
  el.value = ''; haptic();
  await refreshOrderData(cur(), 'order_message', { text });
}

V.order = (c) => {
  if (!c.data) { refreshOrderData(c); return loader(); }
  const o = c.data.order;
  const hint = o.status === 'processing' ? STATUS_HINT['processing_' + (o.kind === 'physical' ? 'physical' : 'digital')]
    : o.status === 'refunded' && o.method === 'stars' ? 'Звёзды вернулись на ваш баланс.' : STATUS_HINT[o.status];
  let actions = '';
  if (c.disputeOpen && ['processing', 'delivered'].includes(o.status)) {
    actions = `<div class="card"><b>Что пошло не так?</b>
      <div class="xs mut" style="margin:4px 0 10px">Продавец увидит описание в чате заказа и поможет разобраться. Если вопрос не решится, деньги вернут.</div>
      <textarea id="dispute-text" placeholder="Например: ключ не активируется, пишет «уже использован»"></textarea>
      <div class="btns" style="margin-top:10px"><button class="btn ghost" onclick="cur().disputeOpen=false;refresh()">Назад</button><button class="btn bad" onclick="sendDispute()">Открыть спор</button></div></div>`;
  } else if (o.status === 'pending') {
    actions = `<button class="btn pri" onclick="payAgain(${o.id})">Оплатить ${money(o.total, o.currency)}</button>
      ${o.method === 'crypto' ? '<button class="btn" style="margin-top:8px" onclick="checkCrypto()">🔄 Я оплатил — проверить</button>' : ''}
      <button class="btn ghost" style="margin-top:8px" onclick="orderAct('order_cancel','Отменить заказ?')">Отменить заказ</button>`;
  } else if (o.status === 'delivered') {
    actions = `<button class="btn ok" onclick="orderAct('order_confirm','Подтвердить получение? После этого сделка закроется.')">✅ Подтвердить получение</button>
      <button class="btn bad" style="margin-top:8px" onclick="openDispute()">Есть проблема — открыть спор</button>`;
  } else if (o.status === 'processing') {
    actions = `<button class="btn ghost" onclick="openDispute()">Открыть спор</button>`;
  } else if (o.status === 'completed' && !o.reviewed) {
    c.rating = c.rating || 5;
    actions = `<div class="card"><b>Оцените покупку</b>
      <div class="rate" style="margin:10px 0">${[1, 2, 3, 4, 5].map((n) => `<button class="${n <= c.rating ? 'on' : ''}" onclick="cur().rating=${n};haptic();refresh()">⭐</button>`).join('')}</div>
      <textarea id="rev-text" placeholder="Пара слов о товаре и продавце (необязательно)" style="min-height:70px"></textarea>
      <button class="btn pri" style="margin-top:10px" onclick="sendReview()">Отправить отзыв</button></div>`;
  } else if (o.reviewed) {
    actions = `<div class="card sm mut">Ваш отзыв: <span class="stars">${'★'.repeat(o.reviewed)}</span> — спасибо!</div>`;
  }
  return `<div class="row between"><div class="h1" style="margin:4px 0">Заказ #${o.id}</div><span class="st s-${o.status}">${STATUS[o.status]}</span></div>
    ${progress(o)}
    <div class="info" style="margin-top:14px">${esc(hint || '')}</div>
    ${resultBlocks(o)}
    <div class="h2">Состав</div>${itemsCard(o)}
    ${o.delivery ? `<div class="h2">Доставка</div><div class="card sm">${esc(o.delivery.name)} · ${esc(o.delivery.phone)}<div class="mut">${esc(o.delivery.address)}</div>${o.delivery.comment ? `<div class="mut">💬 ${esc(o.delivery.comment)}</div>` : ''}</div>` : ''}
    ${actions ? `<div style="margin-top:16px">${actions}</div>` : ''}
    ${chatBlock(c, 'buyer')}`;
};
async function payAgain(id) {
  try { openPayment(await api('order_pay', { id }), id); } catch (e) { toast(e.message, 'err'); }
}
async function checkCrypto() {
  const c = cur();
  toast('Проверяем оплату…');
  await refreshOrderData(c, 'order_check_crypto');
  if (c.data && c.data.order.status === 'pending') toast('Оплата пока не поступила', 'err'); else hapticN();
}
async function orderAct(call, q) {
  if (q && !(await ask(q))) return;
  hapticN(); await refreshOrderData(cur(), call);
}
function openDispute() { cur().disputeOpen = true; haptic(); refresh(); }
async function sendDispute() {
  const reason = ($('#dispute-text').value || '').trim();
  if (!reason) return toast('Опишите проблему', 'err');
  cur().disputeOpen = false;
  await refreshOrderData(cur(), 'order_dispute', { reason });
}
async function sendReview() {
  const c = cur();
  await refreshOrderData(c, 'order_review', { rating: c.rating, text: $('#rev-text').value });
  hapticN(); toast('Спасибо за отзыв!', 'ok');
  reloadCatalog();
}
async function reloadCatalog() {
  try { const d = await api('bootstrap'); S.data = { ...S.data, ...d }; } catch (e) {}
}

const A = {};

  const td = (m) => (s.todayBy.find((x) => x.method === m) || {}).sum || 0;
  const max = Math.max(1, ...s.chart);

      <div class="kpi hl"><span class="xs mut">Заказов сегодня</span><b>${s.today}</b></div>
      <div class="kpi hl"><span class="xs mut">Сегодня</span><b style="font-size:15px">${td('stars')} ⭐ · ${num(td('rub') + td('crypto'))} ₽</b></div>

      <div class="kpi" onclick="S.ordersFilter='active';S.adminTab='orders';render(true)"><span class="xs mut">Споры</span><b style="${s.dispute ? 'color:#f87171' : ''}">${s.dispute}</b></div>
    </div>
    <div class="h2">Выручка за всё время</div>

      ${S.data.payments.rub || by('rub').n ? `<div class="sum"><span>💳 Карта · ${by('rub').n || 0} зак.</span><b>${num(by('rub').sum)} ₽</b></div>` : ''}
      <div class="sum"><span>₿ Крипта · ${by('crypto').n || 0} зак.</span><b>${num(by('crypto').sum)} ₽</b></div>
      <div class="sum total"><span>Пользователей · покупателей</span><span>${s.users} · ${s.buyers}</span></div>
    </div>
    <div class="h2">Заказы за 7 дней</div>
    <div class="card"><div class="bars">${s.chart.map((n, i) => `<div><span style="color:var(--tx)">${n || ''}</span><i style="height:${Math.max(3, n / max * 64)}px"></i><span>${days[i]}</span></div>`).join('')}</div></div>
    ${s.low.length ? `<div class="h2">⚠️ Заканчиваются ключи</div><div class="card">${s.low.map((p) => `<div class="line-item" onclick="go('aproduct',{id:${p.id}})"><span>${esc(p.emoji)}</span><span class="grow sm">${esc(p.title)}</span><b style="color:${p.free ? '#fbbf24' : '#f87171'}">${p.free}</b></div>`).join('')}</div>` : ''}
    ${s.top.length ? `<div class="h2">Топ продаж</div><div class="card">${s.top.map((p, i) => `<div class="line-item"><span class="dim">${i + 1}</span><span>${esc(p.emoji)}</span><span class="grow sm">${esc(p.title)}</span><b>${p.sold}</b></div>`).join('')}</div>` : ''}
    ${s.reviews.length ? `<div class="h2">Свежие отзывы</div>${s.reviews.map((r) => `<div class="card rev"><div class="row between"><b class="sm">${esc(r.user_name)}</b><span class="stars">${'★'.repeat(r.rating)}</span></div><div class="xs mut">${esc(r.title || '')}</div>${r.text ? `<div class="sm" style="margin-top:4px">${esc(r.text)}</div>` : ''}</div>`).join('')}` : ''}`;
};

A.orders = async () => {

  const { orders } = await api('admin_orders', { filter: f });
  const fl = [['active', 'В работе и споры'], ['pending', 'Не оплачены'], ['done', 'Выданы'], ['refunded', 'Возвраты и отмены'], ['all', 'Все']];

    ${orders.length ? orders.map((o) => ocard(o, true)).join('') : '<div class="empty"><div class="ei">✨</div>Здесь пусто</div>'}`;

V.aorder = (c) => {
  if (!c.data) { refreshOrderData(c); return loader(); }
  const o = c.data.order;
  const who = o.username ? `<a href="#" onclick="tg.openTelegramLink('https://t.me/${esc(o.username)}');return false" style="color:var(--acc2)">@${esc(o.username)}</a>` : `ID ${o.user_id}`;
  let actions = '';
  if (['processing', 'dispute'].includes(o.status)) {
    actions += `<div class="card"><b>${o.kind === 'physical' ? 'Отправить заказ' : 'Выдать товар'}</b>
      <div class="xs mut" style="margin:4px 0 10px">${o.kind === 'physical' ? 'Трек-номер и служба доставки. Покупатель получит уведомление.' : 'Логин, пароль, код или отчёт — каждая строка будет с кнопкой «Копировать».'}</div>
      <textarea id="deliver-text" placeholder="${o.kind === 'physical' ? 'СДЭК 1234567890' : 'Логин: …\nПароль: …'}"></textarea>
      <button class="btn pri" style="margin-top:10px" onclick="adminAct('deliver')">${o.kind === 'physical' ? '🚚 Отправлено' : '✅ Выдать'}</button></div>`;
  }
  const btns = [];
  if (['processing', 'delivered', 'dispute'].includes(o.status)) btns.push(`<button class="btn ok sm" onclick="adminAct('complete','Завершить заказ без подтверждения покупателя?')">Завершить</button>`);
  if (['processing', 'delivered', 'completed', 'dispute'].includes(o.status)) btns.push(`<button class="btn bad sm" onclick="adminAct('refund','${o.method === 'stars' ? 'Вернуть звёзды покупателю? Это действие нельзя отменить.' : 'Отметить возврат? Деньги нужно вернуть вручную через платёжную систему.'}')">Вернуть деньги</button>`);
  if (o.status === 'pending') btns.push(`<button class="btn ghost sm" onclick="adminAct('cancel','Отменить неоплаченный заказ?')">Отменить</button>`);
  return `<div class="row between"><div class="h1" style="margin:4px 0">Заказ #${o.id}</div><span class="st s-${o.status}">${STATUS[o.status]}</span></div>
    <div class="card sm" style="margin-top:12px">👤 ${esc(o.user_name)} · ${who}</div>
    ${o.delivery ? `<div class="card sm" style="margin-top:8px">🚚 ${esc(o.delivery.name)} · <a href="tel:${esc(o.delivery.phone)}" style="color:var(--acc2)">${esc(o.delivery.phone)}</a><div class="mut">${esc(o.delivery.address)}</div>${o.delivery.comment ? `<div class="mut">💬 ${esc(o.delivery.comment)}</div>` : ''}</div>` : ''}
    <div class="h2">Состав</div>${itemsCard(o)}
    ${resultBlocks(o)}
    ${actions || btns.length ? `<div class="h2">Действия</div>${actions}${btns.length ? `<div class="btns" style="margin-top:10px">${btns.join('')}</div>` : ''}` : ''}
    ${chatBlock(c, 'seller')}`;
};
async function adminAct(action, q) {
  if (q && !(await ask(q))) return;
  const c = cur();
  const text = action === 'deliver' ? ($('#deliver-text').value || '').trim() : '';
  if (action === 'deliver' && !text) { toast('Заполните данные для выдачи', 'err'); return; }
  try { c.data = await api('admin_order_action', { id: c.id, action, text }); hapticN(); toast('Готово', 'ok'); refresh(); }
  catch (e) { hapticN('error'); toast(e.message, 'err'); }
}

    const r = await api('admin_products');
    S.adminGames = r.games;
    c.base = c.id ? r.products.find((x) => x.id === c.id) : { kind: 'digital_auto', section: 'keys', active: 1, emoji: '🎮' };

  const base = c.base;
  if (!base) return '<div class="empty">Товар не найден</div>';
  c.kind = c.kind || base.kind;
  // черновик сохраняет введённое, когда форма перерисовывается
  const p = c.draft || { ...base, price: base.kind === 'physical' ? base.price_rub : base.price_stars };
  let stock = '';
  if (c.id && c.kind === 'digital_auto') {
    const st = await api('admin_stock', { product_id: c.id });

      <div class="card">
        <textarea id="stock-add" placeholder="Вставьте ключи — по одному в строке" style="font-family:ui-monospace,monospace;font-size:13px"></textarea>

  const phys = c.kind === 'physical';
  return `<div class="h1">${c.id ? 'Товар' : 'Новый товар'}</div>
    <div class="card">
      <div class="row"><div style="width:76px"><label class="label" style="margin-top:0">Эмодзи</label><input id="f-emoji" value="${esc(p.emoji || '')}" style="text-align:center;font-size:20px"></div>
        <div class="grow"><label class="label" style="margin-top:0">Название *</label><input id="f-title" value="${esc(p.title || '')}"></div></div>
      <label class="label">Тип выдачи</label>
      <select id="f-kind" onchange="keepForm(this.value)">${Object.entries(KIND).map(([k, v]) => opt(k, v.name, c.kind)).join('')}</select>
      <div class="grid2">
        <div><label class="label">Игра</label><select id="f-game">${opt('', 'Без игры', p.game_id)}${S.adminGames.map((g) => opt(g.id, g.title, p.game_id)).join('')}</select></div>
        <div><label class="label">Раздел</label><select id="f-section">${Object.entries(S.data.sections).map(([k, s]) => opt(k, s.title, p.section)).join('')}</select></div>
      </div>
      <div class="grid2">
        <div><label class="label">${phys ? 'Цена, ₽ *' : 'Цена, ⭐ *'}</label><input id="f-price" type="number" min="1" value="${esc(p.price ?? '')}"></div>
        <div><label class="label">Остаток</label>${c.kind === 'digital_auto' ? '<input disabled value="по складу ключей">' : `<input id="f-stock" type="number" min="0" placeholder="∞ без лимита" value="${p.stock ?? ''}">`}</div>
      </div>
      <label class="label">Что спросить у покупателя</label><input id="f-ask" value="${esc(p.ask || '')}" placeholder="Например: UID и сервер (пусто — не спрашивать)">
      <label class="label">Бейдж</label><input id="f-badge" value="${esc(p.badge || '')}" placeholder="Хит, Новинка, Редкое… (попадёт в «Популярное»)">
      <label class="label">Описание</label><textarea id="f-desc" rows="5">${esc(p.description || '')}</textarea>
      <label class="check"><input type="checkbox" id="f-active" ${p.active ? 'checked' : ''}><span>Показывать в магазине</span></label>
      <button class="btn pri" style="margin-top:12px" onclick="saveProduct(${c.id || 0})">Сохранить</button>
      ${c.id ? `<button class="btn ghost sm" style="margin:10px auto 0" onclick="shareProduct(${c.id})">🔗 Скопировать ссылку на товар</button>` : ''}
    </div>${stock}`;
};
function readDraft() {
  const v = (k) => { const el = $('#f-' + k); return el ? el.value : ''; };
  return {
    emoji: v('emoji'), title: v('title'), game_id: v('game'), section: v('section'), price: v('price'),
    stock: $('#f-stock') ? v('stock') : (cur().draft || cur().base || {}).stock ?? '',
    ask: v('ask'), badge: v('badge'), description: v('desc'), active: $('#f-active').checked,
  };
}
function keepForm(kind) { const c = cur(); c.draft = readDraft(); c.kind = kind; render(false); }
function readForm(id) {
  const d = readDraft(), kind = cur().kind;
  return {
    id, kind, emoji: d.emoji, title: d.title, game_id: d.game_id, section: d.section,
    price_stars: kind === 'physical' ? '' : d.price, price_rub: kind === 'physical' ? d.price : '',
    stock: kind === 'digital_auto' ? '' : d.stock, ask: d.ask, badge: d.badge, description: d.description, active: d.active,
  };
}
async function saveProduct(id) {
  try {
    const r = await api('admin_product_save', { product: readForm(id) });
    hapticN(); toast('Сохранено', 'ok');
    await reloadCatalog();
    S.stack[S.stack.length - 1] = { v: 'aproduct', id: r.id };
    render(!id);
  } catch (e) { hapticN('error'); toast(e.message, 'err'); }
}
async function stockAdd(pid) {
  const text = $('#stock-add').value;
  try { const r = await api('admin_stock_add', { product_id: pid, text }); hapticN(); toast(`Добавлено ключей: ${r.added}`, 'ok'); reloadCatalog(); refresh(); }
  catch (e) { toast(e.message, 'err'); }
}
async function stockDel(id) {
  if (!(await ask('Удалить ключ со склада?'))) return;
  try { await api('admin_stock_delete', { id }); reloadCatalog(); refresh(); } catch (e) { toast(e.message, 'err'); }
}

A.promos = async () => {
  const { promos } = await api('admin_promos');
  return `<div class="card">
      <b>Новый промокод</b>
      <div class="grid2" style="margin-top:4px">
        <div><label class="label">Код</label><input id="pr-code" placeholder="SALE15" oninput="this.value=this.value.toUpperCase()"></div>
        <div><label class="label">Скидка, %</label><input id="pr-pct" type="number" min="1" max="90" placeholder="15"></div>
      </div>
      <label class="label">Сколько раз можно использовать</label><input id="pr-uses" type="number" min="0" placeholder="Пусто — без ограничений">
      <button class="btn pri" style="margin-top:12px" onclick="savePromo()">Создать</button></div>
    <div class="h2">Активные</div>
    ${promos.length ? `<div class="card" style="padding:4px 14px">${promos.map((p) => `<div class="line-item"><span class="grow"><b>${esc(p.code)}</b> <span class="mut">−${p.percent}%</span><div class="xs dim">${p.uses_left === null ? 'без ограничений' : 'осталось ' + p.uses_left}</div></span><button class="x" onclick="delPromo('${esc(p.code)}')">✕</button></div>`).join('')}</div>` : '<div class="card mut sm">Промокодов нет</div>'}`;
};
async function savePromo() {
  try { await api('admin_promo_save', { code: $('#pr-code').value, percent: $('#pr-pct').value, uses_left: $('#pr-uses').value }); hapticN(); toast('Промокод создан', 'ok'); render(false); }
  catch (e) { toast(e.message, 'err'); }
}
async function delPromo(code) {
  if (!(await ask(`Удалить промокод ${code}?`))) return;
  try { await api('admin_promo_delete', { code }); render(false); } catch (e) { toast(e.message, 'err'); }
}

A.mail = () => `<div class="card">
    <b>Рассылка всем пользователям бота</b>
    <div class="xs mut" style="margin:4px 0 10px">Сообщение придёт в чат с ботом с кнопкой «Открыть маркет». Подходит для новинок, скидок и акций.</div>
    <textarea id="mail-text" rows="6" placeholder="🔥 Скидка 20% на все ключи до воскресенья по промокоду LOOT20"></textarea>
    <button class="btn pri" style="margin-top:12px" onclick="sendMail()">📣 Отправить</button></div>`;
async function sendMail() {
  const text = $('#mail-text').value.trim();
  if (!text) return toast('Введите текст', 'err');
  if (!(await ask('Отправить сообщение всем пользователям?'))) return;
  try { const r = await api('admin_broadcast', { text }); hapticN(); toast(`Рассылка запущена: ${r.queued} получателей`, 'ok'); $('#mail-text').value = ''; }
  catch (e) { toast(e.message, 'err'); }
}

/* ═══════════════ Запуск ═══════════════ */
async function start() {
  if (!tg || !tg.initData) {
    $('#app').innerHTML = '<div class="empty"><div class="ei">🎮</div><b>LOOTBOX</b><div style="margin-top:6px">Откройте магазин через Telegram-бота.</div></div>';
    $('.tabbar').style.display = 'none';
    return;
  }
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('#0a0c11'); tg.setBackgroundColor('#0a0c11'); tg.setBottomBarColor && tg.setBottomBarColor('#0a0c11'); } catch (e) {}
  try { tg.disableVerticalSwipes(); } catch (e) {}
  tg.BackButton.onClick(back);
  if (API_URL.includes('ВАШ-ВОРКЕР')) {
    $('#app').innerHTML = errorBox('В index.html не указан адрес воркера (API_URL).');
    return;
  }
  try {
    const [d, cart, del] = await Promise.all([api('bootstrap'), store.get('cart'), store.get('delivery')]);
    S.data = d;
    try { S.cart = JSON.parse(cart || '[]').filter((i) => i && i.id); } catch (e) { S.cart = []; }
    try { S.delivery = JSON.parse(del || '{}') || {}; } catch (e) { S.delivery = {}; }
  } catch (e) {
    $('#app').innerHTML = errorBox(e.message);
    return;
  }
  // Глубокие ссылки: #p=12, #o=12, #ao=12, #orders, #admin или start_param p_12 / o_12
  const h = (location.hash || '').slice(1);
  const sp = (tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  let m;
  if ((m = /^p[=_](\d+)$/.exec(h) || /^p_(\d+)$/.exec(sp)) && P(m[1])) S.stack = [{ v: 'home' }, { v: 'product', id: +m[1] }];
  else if ((m = /^o[=_](\d+)$/.exec(h) || /^o_(\d+)$/.exec(sp))) S.stack = [{ v: 'orders' }, { v: 'order', id: +m[1] }];
  else if ((m = /^ao=(\d+)$/.exec(h)) && d_admin()) S.stack = [{ v: 'admin' }, { v: 'aorder', id: +m[1] }];
  else if (h === 'orders') S.stack = [{ v: 'orders' }];
  else if (h === 'admin' && d_admin()) S.stack = [{ v: 'admin' }];
  render(true);
}
const d_admin = () => S.data && S.data.admin;
start();
</script>
